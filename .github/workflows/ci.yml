name: AITS Continuous Integration & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Static Code Analysis & Typecheck
        run: npm run lint

      - name: Build All Packages (Shared, Backend, Frontend)
        run: npm run build

      - name: Execute Full Vitest Test Suite
        run: npm run test
