<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applications Issue Tracking System</title>
    <script>
      (function() {
        function showError(title, msg) {
          var el = document.getElementById('root');
          if (el && el.innerHTML.trim() === '') {
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#fee2e2;border:2px solid #ef4444;color:#991b1b;padding:24px;border-radius:8px;font-family:sans-serif;z-index:999999;';
            box.innerHTML = '<h3 style="margin:0 0 8px;font-size:18px;">' + title + '</h3><p style="margin:0;font-family:monospace;white-space:pre-wrap;">' + msg + '</p>';
            document.body ? document.body.appendChild(box) : document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(box); });
          }
        }
        window.addEventListener('error', function(e) {
          showError('Application Error', (e.message || (e.error && e.error.stack) || e.error));
        });
        window.addEventListener('unhandledrejection', function(e) {
          var details = (e.reason && (e.reason.stack || e.reason.message)) || e.reason || 'Unhandled Promise Rejection';
          showError('Unhandled Promise Rejection', details);
        });
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
