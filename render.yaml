services:
  # ── AITS Backend API Web Service ──────────────────────────────────────────
  - type: web
    name: aits-backend
    runtime: node
    plan: free
    region: oregon
    # The Node server serves frontend/dist in production. Build the complete
    # monorepo so the SPA assets are present in the runtime image as well.
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: aits-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: AI_ENABLED
        value: "false"

  # ── AITS Frontend Single Page Application (Static Site) ───────────────────
  - type: static
    name: aits-frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "" # Set to your deployed backend URL + /api/v1 (e.g. https://aits-backend.onrender.com/api/v1)

databases:
  # ── Managed PostgreSQL Database ───────────────────────────────────────────
  - name: aits-postgres
    databaseName: app_issue_track
    user: aits_admin
    plan: free
    region: oregon
